<mat-card (click)="viewProductDetails()">
  <mat-card-header>
    <mat-card-title>{{ product.title }}</mat-card-title>
    <mat-card-subtitle>{{ product.price }}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    {{ product.description }}
  </mat-card-content>
  <mat-card-actions>
    <button mat-button (click)="addToCart($event)">Agregar al carrito</button> <!-- Pasar el evento $event -->
  </mat-card-actions>
</mat-card>
